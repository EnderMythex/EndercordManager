name: Release

on:
    push:
        branches: [main]
        paths-ignore: ["**.md", ".github/assets/**"]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            VERSION_NAME: 1.0.${{ github.run_number }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            - uses: gradle/actions/setup-gradle@v4

            - name: Decode keystore
              env:
                  KEYSTORE: ${{ secrets.KEYSTORE }}
              run: |
                  if [ -n "$KEYSTORE" ]; then
                    echo "$KEYSTORE" | base64 -d > app/keystore.jks
                  else
                    echo "::notice::No KEYSTORE secret, the manager is signed with a debug key."
                  fi

            - name: Build
              env:
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
              run: |
                  ./gradlew assembleRelease -Pversion=$VERSION_NAME --no-daemon
                  mkdir dist
                  cp app/build/outputs/apk/release/*.apk dist/EndercordManager.apk

            - name: Publish
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "v$VERSION_NAME" dist/EndercordManager.apk \
                    --target "$GITHUB_SHA" --title "EnderCord Manager $VERSION_NAME" --generate-notes --latest
